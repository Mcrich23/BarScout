<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#F8F1E7"/>
      <stop offset=".38" stop-color="#D9D2CC"/>
      <stop offset=".89" stop-color="#A9A8AF"/>
      <stop offset="1" stop-color="#E5D5CE"/>
