    <path d="M601 514h173" stroke="#797786" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    <rect x="577" y="329" width="226" height="163" rx="44" fill="#070811" opacity=".55"/>
    <rect x="572" y="302" width="226" height="161" rx="40" fill="url(#keyEdge)"/>
